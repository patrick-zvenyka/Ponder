<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Ponder-logo.png') }}">
    <title>Admin Login - Ponder.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['DM Sans', 'sans-serif'], display: ['Newsreader', 'serif'] },
                    colors: { ink: '#18231f', forest: '#24594a', paper: '#f7f7f2', line: '#dfe4dc' }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased">
    <header class="border-b border-line bg-white"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-5 sm:px-8"><a href="{{ url_for('index') }}" class="font-display text-3xl font-semibold tracking-tight text-forest">Ponder<span class="text-ink">.</span></a><span class="rounded-full border border-line bg-paper px-3 py-1.5 text-xs font-semibold text-ink/70">Instance {{ node }}</span></div></header>
    <main class="mx-auto grid min-h-[calc(100vh-145px)] max-w-6xl items-center gap-12 px-5 py-12 sm:px-8 md:grid-cols-[1fr_0.85fr] md:gap-20">
        <section class="max-w-lg">
            <p class="mb-4 text-xs font-bold uppercase tracking-[0.16em] text-forest">Ponder News / Admin</p>
            <h1 class="font-display text-5xl leading-tight sm:text-6xl">Good to have you <span class="text-forest">back.</span></h1>
            <p class="mt-5 max-w-md text-base leading-7 text-ink/65">Sign in to share a new story with the Ponder community.</p>
        </section>
        <section class="rounded-lg border border-line bg-white p-6 shadow-sm sm:p-8">
            <h2 class="text-xl font-bold">Admin sign in</h2>
            <p class="mt-1 text-sm text-ink/60">Enter your account details to continue.</p>
            {% if error %}<div role="alert" class="mt-6 rounded-md border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-800">{{ error }}</div>{% endif %}
            <form method="POST" action="{{ url_for('login') }}" class="mt-7 space-y-5">
                <div><label for="username" class="mb-2 block text-sm font-semibold">Username</label><input class="w-full rounded-md border border-line bg-white px-3.5 py-3 text-base outline-none transition placeholder:text-ink/35 focus:border-forest focus:ring-2 focus:ring-forest/15" type="text" id="username" name="username" autocomplete="username" required></div>
                <div><label for="password" class="mb-2 block text-sm font-semibold">Password</label><input class="w-full rounded-md border border-line bg-white px-3.5 py-3 text-base outline-none transition placeholder:text-ink/35 focus:border-forest focus:ring-2 focus:ring-forest/15" type="password" id="password" name="password" autocomplete="current-password" required></div>
                <button type="submit" class="w-full rounded-md bg-forest px-4 py-3 text-sm font-semibold text-white transition hover:bg-ink focus:outline-none focus:ring-2 focus:ring-forest focus:ring-offset-2">Sign In</button>
            </form>
            <a href="{{ url_for('index') }}" class="mt-5 inline-flex text-sm font-semibold text-forest hover:text-ink">← Back to the feed</a>
        </section>
    </main>
</body>
</html>
