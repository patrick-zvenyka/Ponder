<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post - Admin</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Ponder-logo.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['DM Sans', 'sans-serif'], display: ['Newsreader', 'serif'] },
                    colors: { ink: '#18231f', forest: '#24594a', paper: '#f7f7f2', line: '#dfe4dc' }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-paper font-sans text-ink antialiased">
    <header class="border-b border-line bg-white"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-5 sm:px-8"><a href="{{ url_for('index') }}" class="font-display text-3xl font-semibold tracking-tight text-forest">Ponder<span class="text-ink">.</span></a><span class="rounded-full border border-line bg-paper px-3 py-1.5 text-xs font-semibold text-ink/70">Instance {{ node }}</span></div></header>
    <main class="mx-auto max-w-3xl px-5 py-10 sm:px-8 sm:py-14">
        <a href="{{ url_for('index') }}" class="inline-flex items-center text-sm font-semibold text-forest hover:text-ink">← Back to the feed</a>
        <div class="mb-8 mt-8"><p class="mb-3 text-xs font-bold uppercase tracking-[0.16em] text-forest">Ponder News / Editor</p><h1 class="font-display text-5xl leading-tight sm:text-6xl">Start a new story.</h1><p class="mt-3 text-base leading-7 text-ink/65">Give your readers an idea worth pondering.</p></div>
        <form method="POST" action="{{ url_for('admin_new') }}" class="rounded-lg border border-line bg-white p-6 shadow-sm sm:p-8">
            <div class="mb-6"><label for="title" class="mb-2 block text-sm font-semibold">Title</label><input class="w-full rounded-md border border-line bg-white px-3.5 py-3 text-base outline-none transition placeholder:text-ink/35 focus:border-forest focus:ring-2 focus:ring-forest/15" type="text" id="title" name="title" placeholder="A clear, inviting headline" maxlength="150" required></div>
            <div class="mb-7"><label for="content" class="mb-2 block text-sm font-semibold">Story</label><textarea class="min-h-56 w-full resize-y rounded-md border border-line bg-white px-3.5 py-3 text-base leading-7 outline-none transition placeholder:text-ink/35 focus:border-forest focus:ring-2 focus:ring-forest/15" id="content" name="content" rows="8" placeholder="Write something worth sharing..." required></textarea></div>
            <div class="flex flex-col-reverse gap-3 border-t border-line pt-5 sm:flex-row sm:justify-end">
                <a href="{{ url_for('index') }}" class="rounded-md border border-line px-5 py-3 text-center text-sm font-semibold text-ink transition hover:bg-paper focus:outline-none focus:ring-2 focus:ring-forest">Cancel</a>
                <button type="submit" class="rounded-md bg-forest px-5 py-3 text-sm font-semibold text-white transition hover:bg-ink focus:outline-none focus:ring-2 focus:ring-forest focus:ring-offset-2">Publish story</button>
            </div>
        </form>
    </main>
</body>
</html>
